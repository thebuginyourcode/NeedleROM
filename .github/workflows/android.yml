name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (ROM engine)
        run: ./gradlew --no-daemon :core:test

      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NeedleROM-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/NeedleROM.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NeedleROM-apk
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
